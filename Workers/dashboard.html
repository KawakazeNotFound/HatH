<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H@H :: DATA_OVERVIEW</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --muted: #aaaaaa;
            --accent: #ffffff;
            --glow: 0 0 12px rgba(255, 255, 255, 0.5);
            --border: #444444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Courier New", Courier, monospace;
            overflow-x: hidden;
            font-size: 18px;
            font-weight: 600;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 30px;
        }

        h1 {
            font-size: 3.2rem;
            letter-spacing: 0.6rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: var(--glow);
            font-weight: 900;
        }

        .global-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .stat-box {
            padding: 25px;
            border: 2px solid var(--border);
            position: relative;
            transition: all 0.3s ease;
            background: #050505;
        }

        .stat-box:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .stat-label {
            font-size: 1rem;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
        }

        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 35px;
        }

        .client-card {
            background: #050505;
            border: 2px solid var(--border);
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .client-card:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-5px);
        }

        .client-name {
            font-size: 1.6rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .status-pill {
            font-size: 0.9rem;
            padding: 4px 10px;
            border: 2px solid currentColor;
            text-transform: uppercase;
            font-weight: 900;
        }

        .status-active { color: #fff; text-shadow: 0 0 8px #fff; }
        .status-offline { color: #666; }

        .client-info {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.6;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px dotted #333;
            padding-bottom: 2px;
        }

        .info-label { color: #777; font-size: 0.9rem; font-weight: 800; }
        .info-value { color: #eee; font-weight: 700; }

        .top-section {
            margin-top: 20px;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #222;
        }

        .top-header {
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .top-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
            position: relative;
        }

        .top-item:last-child { margin-bottom: 0; }

        .top-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            font-weight: 800;
        }

        .top-value {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
            cursor: pointer;
            border-bottom: 1px dashed #444;
            transition: all 0.2s ease;
            font-weight: 700;
        }

        .top-value:hover {
            color: #fff;
            text-shadow: var(--glow);
            border-bottom-color: var(--accent);
        }

        /* Collapsible Ranks */
        .rank-details {
            margin-top: 10px;
        }

        .rank-summary {
            list-style: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            user-select: none;
            transition: color 0.2s;
        }

        .rank-summary:hover { color: #aaa; }

        .rank-summary::before {
            content: '▶';
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .rank-details[open] .rank-summary::before {
            transform: rotate(90deg);
        }

        .rank-summary::-webkit-details-marker {
            display: none;
        }

        .rank-list {
            margin-top: 10px;
            border-left: 2px solid #222;
            padding-left: 15px;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rank-row {
            display: grid;
            grid-template-columns: 45px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            min-height: 28px;
            font-size: 0.9rem;
            color: #999;
            border-bottom: 1px dotted #222;
            font-weight: 600;
        }

        .rank-row:last-child { border-bottom: 0; }
        .rank-row.interactive { cursor: pointer; }
        .rank-row.interactive:hover { color: #fff; text-shadow: var(--glow); }
        .rank-index { color: #555; font-weight: 800; }
        .rank-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .rank-count { color: #ccc; font-weight: 700; }

        #file-preview-window {
            position: fixed;
            display: none;
            width: 380px;
            background: #000;
            border: 2px solid var(--accent);
            box-shadow: var(--glow);
            z-index: 1000;
            pointer-events: none;
            overflow: hidden;
            padding: 0;
        }

        #file-preview-window .preview-header {
            background: #111;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #aaa;
            border-bottom: 1px solid #333;
            word-break: break-all;
            font-weight: 700;
        }

        #file-preview-window img {
            width: 100%;
            height: auto;
            display: block;
        }

        #hologram-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .hologram-window {
            width: 95%;
            max-width: 1200px;
            background: #000;
            border: 2px solid var(--accent);
            box-shadow: 0 0 40px rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
        }

        .window-title-bar {
            background: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
        }

        .window-title {
            font-size: 1rem;
            letter-spacing: 3px;
            color: #ccc;
            font-weight: 900;
        }

        .window-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .window-action {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 6px 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .window-action:hover:not(:disabled) {
            color: #fff;
            border-color: #fff;
            box-shadow: var(--glow);
        }

        .window-action:disabled {
            color: #444;
            cursor: wait;
        }

        .window-close {
            cursor: pointer;
            color: #fff;
            font-size: 1.8rem;
            line-height: 1;
            font-weight: 900;
        }

        .window-body {
            padding: 25px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .window-img-container img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        .window-footer {
            padding: 20px;
            background: #0a0a0a;
            border-top: 2px solid #222;
            font-size: 1rem;
            color: #aaa;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .footer-label { font-size: 0.8rem; color: #555; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; }
        .footer-value { color: #fff; font-weight: 700; }

        .top-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
            font-weight: 700;
        }

        .top-stat-val { color: #bbb; }

        .loading {
            text-align: center;
            font-size: 2rem;
            margin-top: 150px;
            letter-spacing: 0.4rem;
            animation: pulse 2s infinite;
            font-weight: 900;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: var(--glow); }
            100% { opacity: 0.3; }
        }

        .error {
            color: #ff0000;
            text-align: center;
            margin-top: 50px;
        }

        footer {
            margin-top: 100px;
            text-align: center;
            font-size: 0.9rem;
            color: #444;
            letter-spacing: 0.2rem;
            font-weight: 800;
            border-top: 1px solid #222;
            padding-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DATA::SYSTEM::OVERVIEW</h1>
            <div id="global-stats" class="global-stats">
                <!-- Global stats injected here -->
            </div>
        </header>

        <main id="content">
            <div class="loading">SCANNING SYSTEM...</div>
        </main>

        <div id="file-preview-window">
            <div class="preview-header" id="preview-header-text">ID::UNKNOWN</div>
            <div class="loading-text">RELOADING...</div>
            <img id="preview-img" src="" alt="preview" style="display: none;">
        </div>

        <div id="hologram-modal">
            <div class="hologram-window">
                <div class="window-title-bar">
                    <div class="window-title">SYSTEM::SECURE_VIEWER</div>
                    <div class="window-actions">
                        <button id="imgsearch-btn" class="window-action" onclick="searchCurrentImage()">IMGSEARCH</button>
                        <div class="window-close" onclick="closeModal()">&times;</div>
                    </div>
                </div>
                <div class="window-body">
                    <div class="window-img-container">
                        <img id="modal-img" src="" alt="large preview">
                    </div>
                </div>
                <div id="modal-footer" class="window-footer">
                    <!-- Footer details injected here -->
                </div>
            </div>
        </div>

        <footer>
            HENTAI@HOME :: SECURE_STATISTICS_INTERFACE :: v1.0.0
        </footer>
    </div>

    <script>
        const AUTH_TOKEN = "{{AUTH_TOKEN}}";
        const previewWindow = document.getElementById('file-preview-window');
        const previewImg = document.getElementById('preview-img');
        const previewHeaderText = document.getElementById('preview-header-text');
        const loadingText = previewWindow.querySelector('.loading-text');
        
        const hologramModal = document.getElementById('hologram-modal');
        const modalImg = document.getElementById('modal-img');
        const modalFooter = document.getElementById('modal-footer');
        const imgSearchBtn = document.getElementById('imgsearch-btn');
        let currentModalFileId = '';
        let currentModalClientName = '';

        document.addEventListener('mousemove', (e) => {
            if (previewWindow.style.display === 'block') {
                const x = e.clientX + 25;
                const y = e.clientY + 25;
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;
                const boxWidth = 380;
                const boxHeight = previewWindow.offsetHeight;

                let finalX = x;
                let finalY = y;

                if (x + boxWidth > winWidth) finalX = e.clientX - boxWidth - 25;
                if (y + boxHeight > winHeight) finalY = e.clientY - boxHeight - 25;

                previewWindow.style.left = finalX + 'px';
                previewWindow.style.top = finalY + 'px';
            }
        });

        function showPreview(fileid, clientName) {
            if (!fileid || fileid === 'NO_DATA') return;
            
            previewHeaderText.textContent = `ID::${fileid}`;
            previewWindow.style.display = 'block';
            previewImg.style.display = 'none';
            loadingText.style.display = 'block';
            loadingText.textContent = `FETCHING_DATA::${fileid.substring(0,8)}...`;

            const url = `/v1/cache/file?fileid=${encodeURIComponent(fileid)}&name=${encodeURIComponent(clientName)}&token=${encodeURIComponent(AUTH_TOKEN)}`;
            
            previewImg.onload = () => {
                loadingText.style.display = 'none';
                previewImg.style.display = 'block';
            };
            
            previewImg.onerror = () => {
                loadingText.textContent = 'FETCH_ERROR::ACCESS_DENIED';
            };

            previewImg.src = url;
        }

        function hidePreview() {
            previewWindow.style.display = 'none';
            previewImg.src = '';
        }

        function openModal(fileid, clientName, reqCount, lastSeen) {
            if (!fileid || fileid === 'NO_DATA') return;
            
            hidePreview();
            currentModalFileId = fileid;
            currentModalClientName = clientName;
            imgSearchBtn.disabled = false;
            imgSearchBtn.textContent = 'IMGSEARCH';
            hologramModal.style.display = 'flex';
            modalImg.src = `/v1/cache/file?fileid=${encodeURIComponent(fileid)}&name=${encodeURIComponent(clientName)}&token=${encodeURIComponent(AUTH_TOKEN)}`;
            
            modalFooter.innerHTML = `
                <div class="footer-item">
                    <span class="footer-label">Object Identity</span>
                    <span class="footer-value">${fileid}</span>
                </div>
                <div class="footer-item">
                    <span class="footer-label">Source Node</span>
                    <span class="footer-value">${clientName}</span>
                </div>
                <div class="footer-item">
                    <span class="footer-label">Access Statistics</span>
                    <span class="footer-value">Requests: ${reqCount} | Last Activity: ${lastSeen}</span>
                </div>
            `;
        }

        function closeModal() {
            hologramModal.style.display = 'none';
            modalImg.src = '';
            currentModalFileId = '';
            currentModalClientName = '';
            imgSearchBtn.disabled = false;
            imgSearchBtn.textContent = 'IMGSEARCH';
        }

        async function searchCurrentImage() {
            if (!currentModalFileId || !currentModalClientName) return;

            imgSearchBtn.disabled = true;
            imgSearchBtn.textContent = 'SEARCHING';
            try {
                const url = `/v1/imgsearch?fileid=${encodeURIComponent(currentModalFileId)}&name=${encodeURIComponent(currentModalClientName)}&token=${encodeURIComponent(AUTH_TOKEN)}`;
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                if (!data.search_url) {
                    throw new Error(data.error || `HTTP_${response.status}`);
                }
                window.open(data.search_url, '_blank', 'noopener');
            } catch (err) {
                alert(`IMGSEARCH_FAILED::${err.message}`);
            } finally {
                imgSearchBtn.disabled = false;
                imgSearchBtn.textContent = 'IMGSEARCH';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function maskIp(ip) {
            if (!ip) return "N/A";
            if (ip.includes(':')) {
                const parts = ip.split(':');
                if (parts.length > 1) {
                    parts[parts.length - 1] = '****';
                }
                return parts.join(':');
            } else {
                const parts = ip.split('.');
                if (parts.length === 4) {
                    parts[3] = '***';
                }
                return parts.join('.');
            }
        }

        function formatBytes(bytes) {
            if (!bytes) return "0 B";
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatUptime(seconds) {
            const d = Math.floor(seconds / (3600*24));
            const h = Math.floor(seconds % (3600*24) / 3600);
            const m = Math.floor(seconds % 3600 / 60);
            let s = '';
            if (d > 0) s += d + 'd ';
            if (h > 0 || d > 0) s += h + 'h ';
            s += m + 'm';
            return s;
        }

        function renderFileRanks(files, clientName) {
            const rows = (files || []).slice(1, 10);
            if (!rows.length) return '';

            return `
                <details class="rank-details">
                    <summary class="rank-summary">File Ranks 2-10</summary>
                    <div class="rank-list">
                        ${rows.map((file, index) => `
                            <div class="rank-row interactive"
                                 onmouseenter="showPreview('${file.fileid}', '${clientName}')"
                                 onmouseleave="hidePreview()"
                                 onclick="openModal('${file.fileid}', '${clientName}', '${file.request_count}', '${file.last_seen || ''}')"
                                 title="${file.fileid}">
                                <span class="rank-index">#${index + 2}</span>
                                <span class="rank-name">${file.display_name || file.fileid}</span>
                                <span class="rank-count">${Number(file.request_count || 0).toLocaleString()}</span>
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        function renderIpRanks(ips) {
            const rows = (ips || []).slice(1, 10);
            if (!rows.length) return '';

            return `
                <details class="rank-details">
                    <summary class="rank-summary">Requester Ranks 2-10</summary>
                    <div class="rank-list">
                        ${rows.map((ip, index) => `
                            <div class="rank-row" title="${ip.ip || ''}">
                                <span class="rank-index">#${index + 2}</span>
                                <span class="rank-name">${maskIp(ip.ip)}</span>
                                <span class="rank-count">${Number(ip.request_count || 0).toLocaleString()}</span>
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        async function fetchData() {
            try {
                const response = await fetch(`/v1/overview?token=${encodeURIComponent(AUTH_TOKEN)}`);
                if (!response.ok) throw new Error('CONNECTION_FAILURE');
                const data = await response.json();
                renderDashboard(data);
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="error">ERROR: ${err.message}</div>`;
            }
        }

        function renderDashboard(data) {
            const globalHtml = `
                <div class="stat-box">
                    <div class="stat-label">Total Clients</div>
                    <div class="stat-value">${data.client_count}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Active Nodes</div>
                    <div class="stat-value">${data.active_client_count}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">System Requests</div>
                    <div class="stat-value">${data.total_requests.toLocaleString()}</div>
                </div>
            `;
            document.getElementById('global-stats').innerHTML = globalHtml;

            let clientsHtml = '<div class="client-grid">';
            const clients = Object.values(data.clients).sort((a, b) => b.last_seen_ts - a.last_seen_ts);

            for (const client of clients) {
                const topFile = client.top_file;
                const topIp = client.top_ip;
                const topFiles = client.top_files || (topFile ? [topFile] : []);
                const topIps = client.top_ips || (topIp ? [topIp] : []);

                clientsHtml += `
                    <div class="client-card">
                        <div class="client-name">
                            <span>${client.name}</span>
                            <span class="status-pill ${client.active ? 'status-active' : 'status-offline'}">
                                ${client.active ? 'ONLINE' : 'OFFLINE'}
                            </span>
                        </div>
                        <div class="client-info">
                            <div class="info-row">
                                <span class="info-label">UPTIME</span>
                                <span class="info-value">${formatUptime(client.uptime_s)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">REQUESTS</span>
                                <span class="info-value">${client.total_requests.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">FILES SENT</span>
                                <span class="info-value">${client.files_sent.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CACHE COUNT</span>
                                <span class="info-value">${client.cache_count.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CACHE SIZE</span>
                                <span class="info-value">${formatBytes(client.cache_size)}</span>
                            </div>
                        </div>
                        
                        <div class="top-section">
                            <div class="top-header">Top Intelligence</div>
                            
                            <div class="top-item">
                                <div class="top-label">Dominant File</div>
                                <div class="top-value" 
                                     onmouseenter="showPreview('${topFile ? topFile.fileid : ''}', '${client.name}')" 
                                     onmouseleave="hidePreview()"
                                     onclick="openModal('${topFile ? topFile.fileid : ''}', '${client.name}', '${topFile ? topFile.request_count : 0}', '${topFile ? topFile.last_seen : ''}')"
                                     title="${topFile ? topFile.fileid : ''}">
                                    ${topFile ? topFile.fileid : 'NO_DATA'}
                                </div>
                                ${topFile ? `
                                <div class="top-stats">
                                    <span>REQS: <span class="top-stat-val">${topFile.request_count}</span></span>
                                    <span>SEEN: <span class="top-stat-val">${topFile.last_seen || 'N/A'}</span></span>
                                </div>
                                ` : ''}
                                ${renderFileRanks(topFiles, client.name)}
                            </div>

                            <div class="top-item">
                                <div class="top-label">Dominant Requester</div>
                                <div class="top-value">${topIp ? maskIp(topIp.ip) : 'NO_DATA'}</div>
                                ${topIp ? `
                                <div class="top-stats">
                                    <span>REQS: <span class="top-stat-val">${topIp.request_count}</span></span>
                                    <span>SEEN: <span class="top-stat-val">${topIp.last_seen || 'N/A'}</span></span>
                                </div>
                                ` : ''}
                                ${renderIpRanks(topIps)}
                            </div>
                        </div>
                    </div>
                `;
            }
            clientsHtml += '</div>';
            document.getElementById('content').innerHTML = clientsHtml;
        }

        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
