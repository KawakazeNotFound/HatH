<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H@H :: DATA_OVERVIEW</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --muted: #888888;
            --accent: #ffffff;
            --glow: 0 0 10px rgba(255, 255, 255, 0.4);
            --border: #333333;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Courier New", Courier, monospace;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: var(--glow);
        }

        .global-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-box {
            padding: 20px;
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .client-card {
            background: #050505;
            border: 1px solid var(--border);
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .client-card:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-5px);
        }

        .client-name {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            font-size: 0.7rem;
            padding: 3px 8px;
            border: 1px solid currentColor;
            text-transform: uppercase;
        }

        .status-active { color: #fff; text-shadow: 0 0 5px #fff; }
        .status-offline { color: #444; }

        .client-info {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px dotted #222;
        }

        .info-label { color: #555; font-size: 0.75rem; }
        .info-value { color: #ddd; }

        .top-section {
            margin-top: 15px;
            padding: 12px;
            background: #080808;
            border: 1px solid #1a1a1a;
        }

        .top-header {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .top-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            position: relative;
        }

        .top-item:last-child { margin-bottom: 0; }

        .top-label {
            font-size: 0.65rem;
            color: #444;
            text-transform: uppercase;
        }

        .top-value {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #aaa;
            cursor: pointer;
            border-bottom: 1px dashed #333;
            transition: all 0.2s ease;
        }

        .top-value:hover {
            color: #fff;
            text-shadow: var(--glow);
            border-bottom-color: var(--accent);
        }

        #file-preview-window {
            position: fixed;
            display: none;
            width: 320px;
            background: #000;
            border: 1px solid var(--accent);
            box-shadow: var(--glow);
            z-index: 1000;
            pointer-events: none;
            overflow: hidden;
            padding: 0;
        }

        #file-preview-window .preview-header {
            background: #111;
            padding: 5px 10px;
            font-size: 0.6rem;
            color: #888;
            border-bottom: 1px solid #222;
            word-break: break-all;
        }

        #file-preview-window img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(0.3) contrast(1.1);
        }

        /* Modal / Window Style */
        #hologram-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .hologram-window {
            width: 90%;
            max-width: 1000px;
            background: #000;
            border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            animation: windowOpen 0.3s ease-out;
        }

        @keyframes windowOpen {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .window-title-bar {
            background: #111;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .window-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #aaa;
        }

        .window-close {
            cursor: pointer;
            color: #fff;
            font-size: 1.2rem;
            line-height: 1;
        }

        .window-close:hover { text-shadow: var(--glow); }

        .window-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .window-img-container {
            width: 100%;
            background: #050505;
            display: flex;
            justify-content: center;
            border: 1px solid #111;
        }

        .window-img-container img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .window-footer {
            padding: 15px 20px;
            background: #080808;
            border-top: 1px solid #1a1a1a;
            font-size: 0.8rem;
            color: #888;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .footer-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .footer-label { font-size: 0.6rem; color: #444; text-transform: uppercase; }
        .footer-value { color: #eee; word-break: break-all; }

        #file-preview-window .loading-text {
            padding: 20px;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .top-stats {
            display: flex;
            gap: 15px;
            font-size: 0.7rem;
            color: #666;
            margin-top: 2px;
        }

        .top-stat-val { color: #888; }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 100px;
            letter-spacing: 0.2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: var(--glow); }
            100% { opacity: 0.3; }
        }

        .error {
            color: #ff0000;
            text-align: center;
            margin-top: 50px;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DATA::SYSTEM::OVERVIEW</h1>
            <div id="global-stats" class="global-stats">
                <!-- Global stats injected here -->
            </div>
        </header>

        <main id="content">
            <div class="loading">SCANNING SYSTEM...</div>
        </main>

        <div id="file-preview-window">
            <div class="preview-header" id="preview-header-text">ID::UNKNOWN</div>
            <div class="loading-text">RELOADING...</div>
            <img id="preview-img" src="" alt="preview" style="display: none;">
        </div>

        <div id="hologram-modal">
            <div class="hologram-window">
                <div class="window-title-bar">
                    <div class="window-title">SYSTEM::SECURE_VIEWER</div>
                    <div class="window-close" onclick="closeModal()">&times;</div>
                </div>
                <div class="window-body">
                    <div class="window-img-container">
                        <img id="modal-img" src="" alt="large preview">
                    </div>
                </div>
                <div id="modal-footer" class="window-footer">
                    <!-- Footer details injected here -->
                </div>
            </div>
        </div>

        <footer>
            HENTAI@HOME :: SECURE_STATISTICS_INTERFACE :: v1.0.0
        </footer>
    </div>

    <script>
        const AUTH_TOKEN = "{{AUTH_TOKEN}}";
        const previewWindow = document.getElementById('file-preview-window');
        const previewImg = document.getElementById('preview-img');
        const previewHeaderText = document.getElementById('preview-header-text');
        const loadingText = previewWindow.querySelector('.loading-text');
        
        const hologramModal = document.getElementById('hologram-modal');
        const modalImg = document.getElementById('modal-img');
        const modalFooter = document.getElementById('modal-footer');

        document.addEventListener('mousemove', (e) => {
            if (previewWindow.style.display === 'block') {
                const x = e.clientX + 20;
                const y = e.clientY + 20;
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;
                const boxWidth = 320;
                const boxHeight = previewWindow.offsetHeight;

                let finalX = x;
                let finalY = y;

                if (x + boxWidth > winWidth) finalX = e.clientX - boxWidth - 20;
                if (y + boxHeight > winHeight) finalY = e.clientY - boxHeight - 20;

                previewWindow.style.left = finalX + 'px';
                previewWindow.style.top = finalY + 'px';
            }
        });

        function showPreview(fileid, clientName) {
            if (!fileid || fileid === 'NO_DATA') return;
            
            previewHeaderText.textContent = `ID::${fileid}`;
            previewWindow.style.display = 'block';
            previewImg.style.display = 'none';
            loadingText.style.display = 'block';
            loadingText.textContent = `FETCHING_DATA::${fileid.substring(0,8)}...`;

            const url = `/v1/cache/file?fileid=${encodeURIComponent(fileid)}&name=${encodeURIComponent(clientName)}&token=${encodeURIComponent(AUTH_TOKEN)}`;
            
            previewImg.onload = () => {
                loadingText.style.display = 'none';
                previewImg.style.display = 'block';
            };
            
            previewImg.onerror = () => {
                loadingText.textContent = 'FETCH_ERROR::ACCESS_DENIED';
            };

            previewImg.src = url;
        }

        function hidePreview() {
            previewWindow.style.display = 'none';
            previewImg.src = '';
        }

        function openModal(fileid, clientName, reqCount, lastSeen) {
            if (!fileid || fileid === 'NO_DATA') return;
            
            hidePreview();
            hologramModal.style.display = 'flex';
            modalImg.src = `/v1/cache/file?fileid=${encodeURIComponent(fileid)}&name=${encodeURIComponent(clientName)}&token=${encodeURIComponent(AUTH_TOKEN)}`;
            
            modalFooter.innerHTML = `
                <div class="footer-item">
                    <span class="footer-label">Object Identity</span>
                    <span class="footer-value">${fileid}</span>
                </div>
                <div class="footer-item">
                    <span class="footer-label">Source Node</span>
                    <span class="footer-value">${clientName}</span>
                </div>
                <div class="footer-item">
                    <span class="footer-label">Access Statistics</span>
                    <span class="footer-value">Requests: ${reqCount} | Last Activity: ${lastSeen}</span>
                </div>
            `;
        }

        function closeModal() {
            hologramModal.style.display = 'none';
            modalImg.src = '';
        }

        // Close modal on escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function maskIp(ip) {
            if (!ip) return "N/A";
            if (ip.includes(':')) {
                // IPv6
                const parts = ip.split(':');
                if (parts.length > 1) {
                    parts[parts.length - 1] = '****';
                }
                return parts.join(':');
            } else {
                // IPv4
                const parts = ip.split('.');
                if (parts.length === 4) {
                    parts[3] = '***';
                }
                return parts.join('.');
            }
        }

        function formatBytes(bytes) {
            if (!bytes) return "0 B";
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatUptime(seconds) {
            const d = Math.floor(seconds / (3600*24));
            const h = Math.floor(seconds % (3600*24) / 3600);
            const m = Math.floor(seconds % 3600 / 60);
            let s = '';
            if (d > 0) s += d + 'd ';
            if (h > 0 || d > 0) s += h + 'h ';
            s += m + 'm';
            return s;
        }

        async function fetchData() {
            try {
                const response = await fetch(`/v1/overview?token=${encodeURIComponent(AUTH_TOKEN)}`);
                if (!response.ok) throw new Error('CONNECTION_FAILURE');
                const data = await response.json();
                renderDashboard(data);
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="error">ERROR: ${err.message}</div>`;
            }
        }

        function renderDashboard(data) {
            const globalHtml = `
                <div class="stat-box">
                    <div class="stat-label">Total Clients</div>
                    <div class="stat-value">${data.client_count}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Active Nodes</div>
                    <div class="stat-value">${data.active_client_count}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">System Requests</div>
                    <div class="stat-value">${data.total_requests.toLocaleString()}</div>
                </div>
            `;
            document.getElementById('global-stats').innerHTML = globalHtml;

            let clientsHtml = '<div class="client-grid">';
            const clients = Object.values(data.clients).sort((a, b) => b.last_seen_ts - a.last_seen_ts);

            for (const client of clients) {
                const topFile = client.top_file;
                const topIp = client.top_ip;

                clientsHtml += `
                    <div class="client-card">
                        <div class="client-name">
                            <span>${client.name}</span>
                            <span class="status-pill ${client.active ? 'status-active' : 'status-offline'}">
                                ${client.active ? 'ONLINE' : 'OFFLINE'}
                            </span>
                        </div>
                        <div class="client-info">
                            <div class="info-row">
                                <span class="info-label">UPTIME</span>
                                <span class="info-value">${formatUptime(client.uptime_s)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">REQUESTS</span>
                                <span class="info-value">${client.total_requests.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">FILES SENT</span>
                                <span class="info-value">${client.files_sent.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CACHE COUNT</span>
                                <span class="info-value">${client.cache_count.toLocaleString()}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CACHE SIZE</span>
                                <span class="info-value">${formatBytes(client.cache_size)}</span>
                            </div>
                        </div>
                        
                        <div class="top-section">
                            <div class="top-header">Top Intelligence</div>
                            
                            <div class="top-item">
                                <div class="top-label">Dominant File</div>
                                <div class="top-value" 
                                     onmouseenter="showPreview('${topFile ? topFile.fileid : ''}', '${client.name}')" 
                                     onmouseleave="hidePreview()"
                                     onclick="openModal('${topFile ? topFile.fileid : ''}', '${client.name}', '${topFile ? topFile.request_count : 0}', '${topFile ? topFile.last_seen : ''}')"
                                     title="${topFile ? topFile.fileid : ''}">
                                    ${topFile ? topFile.fileid : 'NO_DATA'}
                                </div>
                                ${topFile ? `
                                <div class="top-stats">
                                    <span>REQS: <span class="top-stat-val">${topFile.request_count}</span></span>
                                    <span>SEEN: <span class="top-stat-val">${topFile.last_seen || 'N/A'}</span></span>
                                </div>
                                ` : ''}
                            </div>

                            <div class="top-item">
                                <div class="top-label">Dominant Requester</div>
                                <div class="top-value">${topIp ? maskIp(topIp.ip) : 'NO_DATA'}</div>
                                ${topIp ? `
                                <div class="top-stats">
                                    <span>REQS: <span class="top-stat-val">${topIp.request_count}</span></span>
                                    <span>SEEN: <span class="top-stat-val">${topIp.last_seen || 'N/A'}</span></span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            clientsHtml += '</div>';
            document.getElementById('content').innerHTML = clientsHtml;
        }

        fetchData();
        setInterval(fetchData, 60000); // Refresh every minute
    </script>
</body>
</html>
